<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaka Masası</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* Vaka Masası · tasarım kimliği (Sinematik Noir) — oyunun TÜM ekranları bu değişkenleri kullanır
   Siyah ve antrasit zemin, sıcak krem yazı ve aksan. Tek yazı ailesi: Outfit (ücretsiz, Google Fonts). Köşe: 6px. Kırmızı yok.
   Anlam renkleri: krem = eylem/seçili, adaçayı = kabul, kehribar = ret/kesinti. Belgeler krem kâğıt üstünde okunur. */
:root{
  --bg:#0B0C0E; --surface:#131416; --surface-2:#1B1C1F; --line:rgba(242,232,215,.11); --line-2:rgba(242,232,215,.24);
  --ink:#F2E8D7; --ink-2:rgba(242,232,215,.76); --muted:rgba(242,232,215,.5);
  --accent:#F2E8D7; --accent-ink:#14120F; --accent-soft:rgba(242,232,215,.075);
  --ok:#A9C3A0; --ok-soft:rgba(169,195,160,.1); --bad:#D9A865; --bad-soft:rgba(217,168,101,.1); --warn:#D9A865;
  --mark:rgba(176,132,92,.42); --mark-line:#9A7049;
  --paper:#EDE4D3; --paper-ink:#1A1815; --paper-muted:#6B6253; --paper-line:#D3C8B3;
  --shadow:none; --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --r:6px; --r-sm:6px;
  --f-ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:var(--f-ui);
  --bar:56px;
  color-scheme:dark;
}

/* ---------- temel ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.375rem}h3{font-size:1.0625rem}
p{margin:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.wrap{max-width:860px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left)) 120px max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:24px}

/* ---------- bileşenler ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:var(--r-sm);padding:0 16px;height:40px;font-weight:600;font-size:.875rem;transition:background .15s,border-color .15s}
.btn:hover{background:#FFF7EA}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.secondary:hover{background:transparent;border-color:var(--ink)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2);padding-inline:8px}
.btn.quiet:hover{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger,.btn.danger:hover{background:var(--bad);border-color:var(--bad);color:#14120F}
.btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iconb{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--ink-2)}
.iconb:hover{background:var(--surface-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.empty{color:var(--muted);text-align:center;padding:28px 16px;border:1px dashed var(--line-2);border-radius:var(--r);font-size:.9375rem}
.field{display:flex;flex-direction:column;gap:6px}
.field-l{font-size:.875rem;font-weight:600;color:var(--ink)}
.field-h{font-size:.8125rem;color:var(--muted)}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg)}
details[open]>summary{margin-bottom:16px}
q{quotes:"“" "”" "‘" "’"}
.toast-zone{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.875rem;font-weight:500;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}

/* ---------- giriş ---------- */
.intro{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:12px}
.intro .prose p{font-family:var(--f-doc);font-size:1.0625rem;line-height:1.8;color:var(--ink-2);animation:fade .4s ease-out both}
.intro .prose{display:flex;flex-direction:column;gap:14px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.goal ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}

/* ---------- uygulama çubuğu ---------- */
.appbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.appbar[hidden]{display:none}
.appbar-in{max-width:1100px;margin:0 auto;height:var(--bar);padding:0 max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:16px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand b{font-size:1rem;font-weight:600}
.brand span{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:2px;margin:0 auto;height:100%}
.topnav button{background:none;border:0;padding:0 14px;height:100%;display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:.9375rem;border-bottom:2px solid transparent;margin-bottom:-1px}
.topnav button:hover{color:var(--ink)}
.topnav button[aria-current]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-size:.72rem;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.count.new{background:var(--accent);color:var(--accent-ink)}
.bar-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.topnav + .bar-r{margin-left:0}
.tabbar{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .tabbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar[hidden]{display:none}
  .tabbar-in{display:grid;grid-template-columns:repeat(5,1fr)}
  .tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:500;position:relative}
  .tabbar button[aria-current]{color:var(--accent)}
  .tabbar .count{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:.66rem}
  .wrap{padding-top:20px}
  .topnav + .bar-r{margin-left:auto}
}
@media (min-width:761px){.toast-zone{bottom:32px}}

/* ---------- sayfa başlığı ---------- */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:1.75rem}
.page-h p{color:var(--muted);margin-top:4px;max-width:60ch}

/* ---------- ilk kullanım şeridi ---------- */
.onboard{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.onboard-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:st}
.steps li{display:flex;flex-direction:column;gap:2px;font-size:.875rem;color:var(--ink-2);counter-increment:st}
.steps li b{color:var(--ink);font-size:.9375rem;display:flex;align-items:center;gap:8px}
.steps li b::before{content:counter(st);width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.75rem;display:inline-grid;place-items:center;flex:none}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* ---------- zarflar ---------- */
.env{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.env-h{display:flex;align-items:center;gap:12px;padding:16px 20px 0}
.env-n{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.env-h h2{font-size:1.0625rem;flex:1;min-width:0}
.env-note{margin:12px 20px 0;padding:2px 0 2px 14px;border-left:2px solid var(--line-2);font-family:var(--f-doc);font-style:italic;color:var(--ink-2);font-size:.9688rem;line-height:1.6}
.env-note cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:.8125rem;color:var(--muted);margin-top:4px}
.docs{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.docs li+li{border-top:1px solid var(--line)}
.docb{width:100%;text-align:left;background:none;border:0;padding:12px 20px;min-height:52px;display:flex;align-items:center;gap:12px;transition:background .12s}
.docb:hover{background:var(--surface-2)}
.docb .dk{font-size:.8125rem;color:var(--muted);width:9.5em;flex:none}
.docb .dt{flex:1;min-width:0;font-weight:500}
.docb .dn{font-size:.78rem;color:var(--muted)}
.docb .st{width:8px;flex:none;display:grid}
.docb.unread .dt{font-weight:600}
.docb svg.i{color:var(--muted);width:18px;height:18px}
@media (max-width:560px){.docb .dk{display:none}.env-h,.docb{padding-inline:16px}.env-note{margin-inline:16px}}

/* ---------- belge paneli ---------- */
.viewer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end}
.viewer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(14,16,20,.45);animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0}}
.drawer{position:relative;width:min(780px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(32px)}}
.drawer-bar{display:flex;align-items:center;gap:12px;height:var(--bar);padding:0 12px 0 8px;border-bottom:1px solid var(--line);background:var(--surface);padding-top:env(safe-area-inset-top);box-sizing:content-box}
.drawer-bar .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-tip{font-size:.8125rem;color:var(--muted);padding:8px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px}
.drawer-tip i{display:inline-block;width:18px;height:10px;background:var(--mark);border-bottom:2px solid var(--mark-line);border-radius:2px}
.drawer-body{flex:1;overflow-y:auto;padding:24px 16px 72px;-webkit-overflow-scrolling:touch}

/* ---------- belge (kâğıt) ---------- */
.paper{max-width:680px;margin:0 auto;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:var(--r-sm);padding:32px clamp(20px,5vw,48px) 40px;font-family:var(--f-doc);font-size:1.0313rem;line-height:1.75;box-shadow:var(--shadow)}
.ph{padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--paper-line);font-family:var(--f-ui)}
.pk{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7A5A36}
.ph h2{font-size:1.5rem;color:var(--paper-ink);margin-top:4px}
.ps{font-size:.875rem;color:var(--paper-muted);margin-top:6px}
.pb{display:flex;flex-direction:column;gap:14px}
.pb h4{font-family:var(--f-ui);font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-muted);margin-top:10px}
.pb .sign{text-align:right;font-style:italic;color:var(--paper-muted)}
.pb .note{font-style:italic;color:#4A4032;background:rgba(26,24,21,.06);border-radius:6px;padding:10px 14px}
.meta{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 20px;font-family:var(--f-ui);font-size:.8438rem;background:rgba(26,24,21,.05);border-radius:6px;padding:12px 14px}
.meta div{display:flex;gap:8px;flex-wrap:wrap}.meta dt{color:var(--paper-muted)}.meta dd{margin:0;font-weight:500}
.qa{display:flex;flex-direction:column;gap:6px}
.qa p{display:grid;grid-template-columns:24px 1fr;gap:6px}
.qa .q{color:var(--paper-muted);font-family:var(--f-ui);font-size:.9375rem}
.qa-l{font-family:var(--f-ui);font-weight:600;font-size:.8125rem;color:var(--paper-muted);padding-top:2px}
.qa .q .qa-l{padding-top:1px}
.li{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-family:var(--f-ui);font-size:.9375rem;line-height:1.55}
.leg li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.leg b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1A1815;color:#EDE4D3;font-size:.72rem;font-weight:600;margin-top:1px}
.kroki-f{margin:0;line-height:0}
.kroki{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--paper-line)}
.tbl{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:.9063rem}
.tbl th{text-align:left;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-muted);border-bottom:1px solid var(--paper-ink);padding:8px}
.tbl td{border-bottom:1px solid var(--paper-line);padding:10px 8px;vertical-align:top}
.p-letter{font-style:normal}
.p-letter .pb>p{text-indent:0}
/* cümleler: hiçbiri öne çıkmaz; yalnızca oyuncunun deftere aldıkları işaretlenir */
.s{cursor:pointer;border-radius:3px;transition:background-color .12s;-webkit-tap-highlight-color:transparent}
span.s:hover,tr.s:hover td{background:rgba(26,24,21,.08)}
span.s.on{background:rgba(176,132,92,.42);box-shadow:inset 0 -2px 0 #9A7049;box-decoration-break:clone;-webkit-box-decoration-break:clone}
tr.s.on td{background:rgba(176,132,92,.42)}
.s:focus-visible{outline:2px solid #1A1815;outline-offset:1px}
.s.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:rgba(176,132,92,.6)}}

/* ---------- defter ---------- */
.nb-g{display:flex;flex-direction:column}
.nb-g-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.nb-g-h button{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;line-height:1.3}
.nb-g-h button b{font-weight:600}
.nb-g-h button span{font-size:.8125rem;color:var(--muted)}
.nb-i{padding:14px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;border-bottom:1px solid var(--line)}
.nb-i:last-child{border-bottom:0}
.nb-i q{font-family:var(--f-doc);font-size:.9844rem;line-height:1.6;color:var(--ink)}
.nb-note{grid-column:1/2;border:0;border-bottom:1px dashed var(--line-2);border-radius:0;background:transparent;padding:4px 0;min-height:34px;font-size:.9063rem;box-shadow:none!important}
.nb-note:focus{border-bottom-color:var(--accent)}
.nb-acts{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.nb-card{padding:0;overflow:hidden}
@media (max-width:560px){.nb-i,.nb-g-h{padding-inline:16px}}

/* ---------- seçim listeleri ---------- */
.picks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);max-height:340px;overflow-y:auto;background:var(--surface)}
.picks.tall{max-height:460px}
.pick{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--surface-2)}
.pick.on{background:var(--accent-soft)}
.pick[hidden]{display:none}
.pick input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.pick q{display:block;font-size:.9063rem;line-height:1.5}
.pick small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.picks .empty{border:0}
.chosen{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 8px 10px 14px;font-family:var(--f-doc);font-size:.9375rem;line-height:1.5}
.ch q{flex:1}
.ch .iconb{width:32px;height:32px}

/* ---------- pano ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.pin header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pin-k{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.pin-k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc,var(--muted))}
.k-celiski{--kc:#D9A865}.k-destek{--kc:#A9C3A0}.k-olay{--kc:#9DB0C4}.k-sira{--kc:#B9A8CC}.k-hipotez{--kc:#F2E8D7}.k-soru{--kc:rgba(242,232,215,.4)}
.pin-t{font-weight:600;line-height:1.4}
.pin ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pin-c{background:var(--surface-2);border:0;border-radius:var(--r-sm);text-align:left;padding:10px 12px;width:100%}
.pin-c q{font-family:var(--f-doc);font-size:.9063rem;line-height:1.5}
.pin-c small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px}
.pin-c:hover{background:var(--accent-soft)}
.kinds{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:0}
.kinds label{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;font-size:.875rem;cursor:pointer}
.kinds label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc)}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds label.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kinds label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* ---------- talep ---------- */
.form-step{display:flex;flex-direction:column;gap:10px;padding:20px 0;border-top:1px solid var(--line)}
.form-step:first-of-type{border-top:0;padding-top:4px}
.step-h{display:flex;align-items:baseline;gap:10px}
.step-h b{font-weight:600}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:.75rem;font-weight:600;display:inline-grid;place-items:center;flex:none;transform:translateY(-1px)}
.step-h .muted{font-size:.875rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border:0;padding:0;margin:0}
.seg label{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line-2);border-radius:var(--r-sm);cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.seg label:hover{border-color:var(--muted)}
.seg label.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.seg b{font-weight:600}
.seg small{color:var(--muted);font-size:.8125rem;line-height:1.35}
@media (max-width:640px){.seg{grid-template-columns:1fr 1fr}}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
.reply{border-radius:var(--r);padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--muted);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.reply.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.reply.no{border-left-color:var(--bad);background:var(--bad-soft)}
.reply-h{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.reply p{font-family:var(--f-doc);font-size:1rem;line-height:1.6}
.reply .btn{align-self:flex-start}
.hint{display:flex;flex-direction:column;gap:10px}
.hint ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-doc)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0;padding-top:0}
.hist-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hist q{font-family:var(--f-doc);font-size:.875rem;color:var(--muted)}

/* ---------- rapor ---------- */
.rq{margin:0;display:flex;flex-direction:column;gap:4px}
.rq legend{float:left;width:100%;padding:0;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;font-weight:600;font-size:1rem}
.rq legend+*{clear:both}
.qn{font-size:.8125rem;color:var(--muted);font-weight:600;min-width:1.4em}
.opt{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;min-height:46px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--line-2)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.opts{display:flex;flex-direction:column;gap:6px}
.err{color:var(--bad);font-weight:600}
.score-card{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:3.25rem;line-height:1;font-weight:600;color:var(--accent);letter-spacing:-.03em}
.res{margin:0;padding:0;list-style:none}
.res li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.res li:first-child{border-top:0}
.res small{color:var(--muted)}
.epi{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);padding:28px clamp(20px,4vw,40px);border-radius:var(--r);font-family:var(--f-doc);line-height:1.8;display:flex;flex-direction:column;gap:14px}
.epi h3{font-family:var(--f-ui);font-size:1.125rem;color:var(--paper-ink);margin-top:8px}
.epi ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* ---------- online: oda, lobi, ekip ---------- */
.narrow{max-width:640px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.rowc{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}.rows li:last-child{padding-bottom:0}
.rows li>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.rows b{font-weight:600;display:flex;align-items:center;gap:8px}
.rows .btn{flex:none}
.rows.tight li{padding:8px 0}
.pres{width:8px;height:8px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted);flex:none}
.pres.on{background:var(--ok);box-shadow:none}
.joinf{display:flex;gap:8px}
.joinf input{flex:1;min-height:40px;height:40px}
#mcode{letter-spacing:.3em;font-weight:600;text-transform:uppercase}
.notice{border:1px solid var(--bad);background:var(--bad-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.9375rem}
.docb.locked{cursor:default;color:var(--muted)}
.docb.locked:hover{background:none}
.docb.locked .dt{font-weight:400}
.pin-by{font-size:.75rem;color:var(--muted)}
.feed{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.feed li.s{font-size:.8125rem;color:var(--muted)}
.feed li.m{display:flex;flex-direction:column;gap:1px;font-size:.9375rem}
.feed li.m b{font-size:.75rem;font-weight:600;color:var(--muted)}
.feed li.m.me b{color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl time{font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.tl-a{display:flex}
.tl-a .iconb{width:32px;height:32px}.tl-a .iconb[disabled]{opacity:.25;cursor:default}
.tlf{display:grid;grid-template-columns:130px 1fr auto;gap:8px;margin-top:14px}
.tlf input{min-height:40px;height:40px}
@media (max-width:560px){.tl li{grid-template-columns:1fr auto}.tl time{grid-column:1/-1}.tlf{grid-template-columns:1fr}}

/* ---------- yardım penceresi ---------- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-card{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border-radius:var(--r);padding:28px;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
.modal-card .close{position:absolute;top:12px;right:12px}
.help-list{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:h}
.help-list li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:h}
.help-list li::before{content:counter(h);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.8125rem;font-weight:600;display:grid;place-items:center}
.help-list b{display:block}
.help-list span{color:var(--ink-2);font-size:.9375rem}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* =========================================================
   Giriş ekranı · sinematik masa sahnesi (siyah + sıcak krem, kırmızı yok)
   ========================================================= */
.login{--cream:#F2E8D7;--cream-2:rgba(242,232,215,.82);--cream-line:rgba(242,232,215,.7);--night:#0B0907;
  position:fixed;inset:0;z-index:20;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--f-ui);
  --vh:100vh;--sw:max(100vw,calc(var(--vh) * 16 / 9));--sh:max(var(--vh),calc(100vw * 9 / 16));color-scheme:dark}
@supports (height:100dvh){.login{--vh:100dvh}}
.login[hidden]{display:none}
.scene{position:absolute;width:var(--sw);height:var(--sh);left:calc((100vw - var(--sw)) / 2);top:calc((var(--vh) - var(--sh)) / 2);pointer-events:none}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
/* lamba: ampul görselde (%13.3, %25.5) noktasında */
.lamp-glow{position:absolute;left:13.3%;top:25.5%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,200,130,.42) 0,rgba(255,170,95,.16) 16%,rgba(255,150,80,.05) 34%,transparent 55%);animation:lampGlow 23s linear infinite}
.lamp-glow i{position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,238,205,.75) 0,rgba(255,210,150,.25) 40%,transparent 70%);animation:lampFlick 3.1s steps(1,end) infinite}
.lamp-off{position:absolute;inset:0;opacity:0;mix-blend-mode:multiply;
  background:radial-gradient(ellipse 34% 62% at 15% 40%,rgba(0,0,0,.92) 0,rgba(0,0,0,.72) 40%,rgba(0,0,0,.25) 70%,transparent 100%);animation:lampOff 23s linear infinite}
@keyframes lampGlow{0%,57.8%{opacity:1}58%{opacity:.1}58.6%{opacity:.85}59.1%{opacity:.05}59.9%{opacity:1}
  86%{opacity:1}86.2%{opacity:0}91.5%{opacity:0}91.8%{opacity:.6}92%{opacity:.1}92.4%{opacity:1}100%{opacity:1}}
@keyframes lampOff{0%,57.8%{opacity:0}58%{opacity:.8}58.6%{opacity:.1}59.1%{opacity:.85}59.9%{opacity:0}
  86%{opacity:0}86.2%{opacity:.9}91.5%{opacity:.9}91.8%{opacity:.35}92%{opacity:.8}92.4%{opacity:0}100%{opacity:0}}
@keyframes lampFlick{0%{opacity:.9}11%{opacity:1}19%{opacity:.82}23%{opacity:.97}41%{opacity:.88}47%{opacity:1}63%{opacity:.93}71%{opacity:.78}74%{opacity:1}88%{opacity:.9}}
.login.still .lamp-glow,.login.still .lamp-glow i,.login.still .lamp-off{animation:none}
@media (prefers-reduced-motion: reduce){.lamp-glow,.lamp-glow i,.lamp-off{animation:none!important}}
.login-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 46% 58% at 50% 50%,rgba(6,5,4,.42),rgba(6,5,4,0) 70%)}

.login-top{position:absolute;top:max(20px,env(safe-area-inset-top));right:max(24px,env(safe-area-inset-right));display:flex;gap:8px;z-index:2}
.login-c{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 20px 32px;
  --w:min(540px,100%)}
.fp{width:clamp(60px,10.5vh,104px);height:auto;fill:none;stroke:var(--cream);stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round;margin-bottom:clamp(14px,2.6vh,28px);opacity:.95}
.login-t{font-weight:800;font-size:clamp(40px,min(5.3vw,9vh),104px);line-height:1;letter-spacing:.005em;color:var(--cream);text-shadow:0 2px 24px rgba(0,0,0,.45)}
.login-sub{display:flex;align-items:center;justify-content:center;gap:clamp(14px,1.6vw,26px);width:var(--w);margin-top:clamp(14px,2.4vh,26px);
  font-size:clamp(11px,1vw,15px);font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--cream-2)}
.login-sub span{white-space:nowrap;margin-right:-.42em}
.login-sub::before,.login-sub::after{content:"";flex:1;max-width:56px;height:1.5px;background:var(--cream-line)}
.login-lede{max-width:var(--w);margin-top:clamp(22px,4.4vh,48px);font-size:clamp(18px,1.6vw,27px);line-height:1.45;color:var(--cream);font-weight:400}
.login-lede mark{background:rgba(176,132,92,.62);color:var(--cream);padding:0 .22em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* giriş formu: minimal — ince çizgi, 46px yükseklik, tek dolu buton, devam bağlantısı düz metin */
.login-f{width:min(360px,100%);display:flex;flex-direction:column;gap:10px;margin-top:clamp(26px,5vh,48px)}
.lfield{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:1px solid rgba(242,232,215,.3);border-radius:6px;background:rgba(8,7,6,.42);transition:border-color .15s,background .15s}
.lfield:focus-within{border-color:rgba(242,232,215,.8);background:rgba(8,7,6,.6)}
.lfield .i{width:18px;height:18px;stroke:rgba(242,232,215,.55);stroke-width:1.6}
.lfield input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0;min-height:0;color:var(--cream);font-size:16px;font-weight:500;box-shadow:none;outline:none}
.lfield input::placeholder{color:rgba(242,232,215,.5);font-weight:400}
.lerr{font-size:13px;color:var(--cream-2);text-align:left}
.lbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s,opacity .15s}
.lbtn .i{width:18px;height:18px;stroke-width:1.8}
.lbtn.primary{height:46px;background:var(--cream);color:#16130F;border:0;font-size:15px}
.lbtn.primary .i{transition:transform .2s}
.lbtn.primary:hover{background:#FFF7EA}
.lbtn.primary:hover .i{transform:translateX(3px)}
.lbtn.ghost{align-self:center;height:40px;margin-top:4px;padding:0 10px;background:none;border:0;color:rgba(242,232,215,.7);font-size:14px;font-weight:500}
.lbtn.ghost:hover:not([aria-disabled="true"]){color:var(--cream)}
.lbtn.ghost .i{width:13px;height:13px;stroke-width:2}
.lbtn[aria-disabled="true"]{opacity:.4;cursor:default}
.lcont{font-size:13px;color:var(--cream-2)}
.lbtn.sq{width:40px;height:40px;background:rgba(8,7,6,.4);color:var(--cream);border:1px solid rgba(242,232,215,.28)}
.lbtn.sq:hover{border-color:rgba(242,232,215,.75)}
.lbtn.sq .i{width:19px;height:19px;stroke-width:1.6}
.login :focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.login .lfield input:focus-visible{outline:none}
.login.shake .lfield{animation:shake .32s ease-in-out}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
/* ana menü: giriş sahnesinin üstünde */
.login-in{display:contents}
.login-in[hidden],.menu-in[hidden]{display:none}
.menu-in{width:min(380px,100%);display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-top:clamp(22px,4.4vh,44px)}
.menu-hi{font-size:14px;color:var(--cream-2);margin-bottom:6px}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;padding:14px 16px;border:1px solid rgba(242,232,215,.3);border-radius:6px;background:rgba(8,7,6,.45);color:var(--cream);transition:border-color .15s,background .15s}
.menu-item:hover{border-color:rgba(242,232,215,.8);background:rgba(8,7,6,.62)}
.menu-item span{display:flex;flex-direction:column;gap:3px}
.menu-item b{font-size:16px;font-weight:600}
.menu-item small{font-size:13px;line-height:1.4;color:rgba(242,232,215,.62)}
.menu-item .i{width:18px;height:18px;stroke-width:1.8;color:rgba(242,232,215,.7);transition:transform .2s}
.menu-item:hover .i{transform:translateX(3px)}
/* dikey ekranlar: lamba görünür kalsın, okunurluk için alt koyulaşma */
@media (max-aspect-ratio: 4/5){
  .scene{left:clamp(calc(100vw - var(--sw)),calc(24vw - var(--sw) * .133),0px)}
  .login-shade{background:linear-gradient(180deg,rgba(6,5,4,.2) 0,rgba(6,5,4,.35) 35%,rgba(6,5,4,.72) 100%)}
}
@media (max-width:560px){
  .login-top{right:16px;top:max(16px,env(safe-area-inset-top))}
  .login-c{padding:84px 20px 28px}
  .login-sub{letter-spacing:.3em}.login-sub span{margin-right:-.3em}
}
@media (max-height:520px) and (orientation:landscape){.fp{display:none}.login-c{padding-top:24px}}
/* giriş ekranı açıkken arka plan kaymasın */
body.on-login{overflow:hidden}
/* ayarlar penceresi: giriş ekranı üstünde koyu */
.modal.dark .modal-card{background:#15120F;color:#F2E8D7;border:1px solid rgba(242,232,215,.18)}
.modal.dark .iconb{color:#F2E8D7}.modal.dark .iconb:hover{background:rgba(242,232,215,.08)}
.modal.dark .muted,.modal.dark .set-h{color:rgba(242,232,215,.62)}
.modal.dark .btn.secondary{background:transparent;color:#F2E8D7;border-color:rgba(242,232,215,.4)}
.set-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column}
.set-list li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.set-list li:first-child{border-top:0}
.set-list b{display:block;font-weight:600}
.set-h{font-size:.8125rem;color:var(--muted)}
.set-list input[type=range]{width:160px;accent-color:#F2E8D7}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:color-mix(in srgb,currentColor 22%,transparent);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:#B08A5C}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid currentColor;outline-offset:2px}

/* =========================================================
   Vaka Haritası · siyah, antrasit, sıcak krem. Kırmızı yok.
   ========================================================= */
.vmap{--cream:#F2E8D7;--cream-2:rgba(242,232,215,.72);--cream-3:rgba(242,232,215,.46);--cream-line:rgba(242,232,215,.7);--hair:rgba(242,232,215,.13);--night:#0B0C0E;--panel:#131416;
  --vh:100vh;--mw:max(100vw,calc(var(--vh) * 16 / 9));--mh:max(var(--vh),calc(100vw * 9 / 16));--px:0;--py:0;
  position:fixed;inset:0;z-index:20;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--f-ui);color-scheme:dark}
@supports (height:100dvh){.vmap{--vh:100dvh}}
.vmap[hidden]{display:none}
.vmap .vmap-map,.vmap .vmap-map.maplibregl-map{position:absolute;inset:0;width:100%;height:100%;background:#0B0C0E}
.vmap-map .maplibregl-canvas{outline:none}
.vmap .maplibregl-map{font-family:var(--f-ui)}
.vpin{width:0;height:0}
/* atıf: zorunlu, ama sahneye uygun */
.vmap .maplibregl-ctrl.maplibregl-ctrl-attrib{background:rgba(11,12,14,.78)!important;color:rgba(242,232,215,.55);font-size:10.5px;border-radius:6px;margin:0 max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) 0}
.vmap .maplibregl-ctrl-attrib a{color:rgba(242,232,215,.78)}
.vmap .maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.55;background-color:transparent!important}
.vmap.open .maplibregl-ctrl-bottom-right{opacity:0;pointer-events:none}
.vmap-zoom{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:calc(max(20px,env(safe-area-inset-bottom)) + 34px);display:flex;align-items:center;gap:6px}
.vmap-zoom .mbtn{height:40px;background:rgba(8,7,6,.4);border-color:rgba(242,232,215,.28);font-size:13px;font-weight:500;padding:0 14px}
.vmap-zoom .mbtn:hover{border-color:rgba(242,232,215,.75)}
.vmap.off .vmap-zoom{display:none}
/* çevrimdışı yedek: şehirler Türkiye çerçevesine göre dizilir */
.vmap-nodes{position:absolute;left:9%;right:9%;top:50%;aspect-ratio:2.14;translate:0 -50%;display:none}
.vmap.off .vmap-nodes{display:block}
/* sis: ağır ağır sürüklenir, fareyle hafifçe kayar */
.vfog{position:absolute;inset:-25%;pointer-events:none;opacity:.9;translate:calc(var(--px) * -18px) calc(var(--py) * -12px);transition:translate .9s ease-out}
.vfog.f1{background:radial-gradient(ellipse 34% 22% at 28% 62%,rgba(190,196,206,.12),transparent 70%),radial-gradient(ellipse 30% 18% at 70% 30%,rgba(190,196,206,.085),transparent 70%);animation:fogA 80s ease-in-out infinite alternate}
.vfog.f2{display:none;background:radial-gradient(ellipse 40% 20% at 62% 74%,rgba(190,196,206,.11),transparent 70%),radial-gradient(ellipse 26% 16% at 18% 26%,rgba(190,196,206,.075),transparent 70%);animation:fogB 110s ease-in-out infinite alternate;translate:calc(var(--px) * -30px) calc(var(--py) * -20px)}
@keyframes fogA{from{transform:translate3d(-5%,1%,0)}to{transform:translate3d(6%,-2%,0)}}
@keyframes fogB{from{transform:translate3d(5%,-1%,0)}to{transform:translate3d(-6%,2%,0)}}
.vmap-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(5,6,7,.6) 100%)}

/* konumlar */
.vnode{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:6px;margin:-24px 0 0 -24px;color:var(--cream);text-align:left;cursor:pointer;border-radius:6px}
.vn-dot{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--cream-line);background:var(--night);font-size:12px;font-weight:700;letter-spacing:.04em;transition:background .2s,color .2s,border-color .2s,transform .2s}
.vn-l{display:flex;flex-direction:column;line-height:1.25;white-space:nowrap;text-shadow:0 1px 6px rgba(9,10,12,.95),0 0 2px rgba(9,10,12,.9)}
.vn-l b{font-size:14px;font-weight:600}
.vn-l small{font-size:11.5px;color:var(--cream-3);letter-spacing:.04em}
.vnode.open .vn-dot,.vnode.done .vn-dot{background:var(--cream);color:#14120F;border-color:var(--cream)}
.vnode.open .vn-dot::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1px solid var(--cream);animation:ring 3.2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.3);opacity:0}}
.vnode.soon{margin:-13px 0 0 -13px;gap:8px}
.vnode.soon .vn-dot{width:14px;height:14px;border-color:rgba(242,232,215,.6)}
.vnode.soon .vn-l b{font-size:13px;font-weight:500;color:var(--cream-2)}

.vnode.soon.left{translate:calc(-100% + 26px) 0}

.vnode.sel .vn-dot{box-shadow:0 0 0 4px var(--night),0 0 0 5.5px var(--cream)}
.vnode.left{flex-direction:row-reverse;text-align:right;margin-left:0;translate:calc(-100% + 24px) 0}
.vmap :focus-visible{outline:2px solid var(--cream);outline-offset:3px}

/* üst şerit ve alt bilgi */
.vmap-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left));pointer-events:none}
.vmap-top>*{pointer-events:auto}
.vmap-brand{display:flex;flex-direction:column;gap:3px;line-height:1;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer}
.vmap-brand b{font-weight:800;font-size:17px;letter-spacing:.06em}
.vmap-brand span{font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--cream-2)}
.vmap-r{display:flex;align-items:center;gap:10px}
.vmap-user{font-size:13px;color:var(--cream-2);margin-right:6px;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmap-foot{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));font-size:12px;letter-spacing:.06em;color:var(--cream-3);pointer-events:none;transition:opacity .3s}
.vmap-foot b{color:var(--cream);font-weight:600}
.vmap.open .vmap-foot{opacity:0}

/* detay paneli: masaüstünde sağdan, telefonda alttan */
.vpanel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--hair);transform:translate3d(100%,0,0);visibility:hidden;transition:transform .55s cubic-bezier(.22,.8,.2,1),visibility 0s .55s;display:flex;flex-direction:column}
.vmap.open .vpanel{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.22,.8,.2,1)}
.vp-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vp-x{position:absolute;top:14px;right:14px;z-index:3;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;border:1px solid rgba(242,232,215,.3);background:rgba(11,12,14,.55);color:var(--cream)}
.vp-x:hover{border-color:var(--cream)}
.vp-x .i{width:16px;height:16px}
.vp-art{position:relative;margin:0;aspect-ratio:16/10;overflow:hidden;background:var(--night)}
.vp-art[hidden]{display:none}
.vp-img{position:absolute;inset:-5%;translate:calc(var(--px) * -12px) calc(var(--py) * -9px);transition:translate .7s ease-out}
.vp-img img{width:100%;height:100%;object-fit:cover;display:block;animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07) translate3d(-1.2%,-.8%,0)}}
.vp-art i{position:absolute;pointer-events:none}
.vp-fog{inset:-30% -40%;translate:calc(var(--px) * 16px) 0;transition:translate .9s ease-out}
.vp-fog.a{background:radial-gradient(ellipse 36% 18% at 30% 72%,rgba(200,206,214,.2),transparent 70%);animation:fogA 34s ease-in-out infinite alternate}
.vp-fog.b{background:radial-gradient(ellipse 30% 14% at 72% 58%,rgba(200,206,214,.14),transparent 70%);animation:fogB 47s ease-in-out infinite alternate}
/* ışıklı pencere (görselde %59.5, %23) */
.vp-win{left:59.5%;top:23%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);translate:calc(var(--px) * -12px) calc(var(--py) * -9px);mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,196,120,.3) 0,rgba(255,170,90,.1) 30%,transparent 60%);animation:lampFlick 3.7s steps(1,end) infinite}
.vp-flash{inset:0;background:#C9D3E0;opacity:0;mix-blend-mode:overlay;animation:flash 19s linear infinite}
@keyframes flash{0%,61%{opacity:0}61.4%{opacity:.55}61.9%{opacity:.08}62.5%{opacity:.4}64%,100%{opacity:0}}
.vp-fade{left:0;right:0;bottom:-1px;height:34%;background:linear-gradient(180deg,transparent,var(--panel))}
.vp-lock{aspect-ratio:16/7;display:grid;place-items:center;border-bottom:1px solid var(--hair);background:repeating-linear-gradient(135deg,transparent 0 13px,rgba(242,232,215,.035) 13px 14px)}
.vp-lock[hidden]{display:none}
.vp-lock:not([hidden])+.vp-body{padding-top:24px}
.vp-lock span{font-weight:700;font-size:22px;letter-spacing:.4em;margin-right:-.4em;text-transform:uppercase;color:rgba(242,232,215,.2)}
.vp-body{padding:6px 28px 0;display:flex;flex-direction:column;min-height:0}
.vp-body>*{opacity:0}
.vmap.open .vp-body>*{animation:rise .5s cubic-bezier(.22,.8,.2,1) both;animation-delay:calc(.16s + var(--i,0) * .055s)}
@keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.vp-no{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--cream-3)}
.vp-t{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:8px;color:var(--cream)}
.vp-file{font-size:13px;color:var(--cream-3);margin-top:6px}
.vp-sum{font-size:15px;line-height:1.65;color:var(--cream-2);margin-top:18px}
.vp-meta{margin:22px 0 0;display:flex;flex-direction:column}
.vp-meta div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-top:1px solid var(--hair);font-size:13.5px}
.vp-meta div:last-child{border-bottom:1px solid var(--hair)}
@media (max-height:760px) and (min-width:761px){.vp-art{aspect-ratio:16/8}.vp-sum{margin-top:14px}.vp-meta{margin-top:16px}.vp-meta div{padding:9px 0}}
.vp-meta dt{color:var(--cream-3)}
.vp-meta dd{margin:0;color:var(--cream);font-weight:500;text-align:right;display:flex;align-items:center;gap:10px}
.pips{display:inline-flex;gap:3px}
.pips i{width:14px;height:4px;border-radius:1px;background:rgba(242,232,215,.2)}

.vp-prog{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.vp-prog-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--cream-3)}

.vp-bar{height:3px;background:rgba(242,232,215,.14);border-radius:2px;overflow:hidden}

.vp-act{display:flex;align-items:center;gap:6px;margin-top:22px;flex-wrap:wrap;position:sticky;bottom:0;z-index:2;background:var(--panel);padding:14px 0 max(22px,env(safe-area-inset-bottom));border-top:1px solid var(--hair)}
.mbtn{height:40px;padding:0 18px;border-radius:6px;font-size:14px;font-weight:600;border:1px solid transparent;background:transparent;color:var(--cream);transition:background .15s,border-color .15s,color .15s}

@media (max-width:760px){
  .vpanel{top:auto;left:0;width:100%;height:min(76%,620px);border-left:0;border-top:1px solid var(--hair);border-radius:6px 6px 0 0;overflow:hidden;transform:translate3d(0,100%,0)}

/* ---------- v5 · kutu mantığı: kilitler, şüpheliler, ipuçları, yeni kâğıtlar ---------- */

.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.susc{display:grid;grid-template-columns:72px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}

function index(env, n){
  ENV[env.id] = Object.assign(env, {n});
  env.docs.forEach(d => {
    DOC[d.id] = Object.assign(d, {env: env.id});
    Object.entries(d.u).forEach(([id, [t, s]]) => { SENT[id] = {t, s, doc: d.id}; });
  });
  env.targets.forEach(t => { TGT[t.id] = t; });
}
async function loadAll(){
  ENV = {}; DOC = {}; SENT = {}; TGT = {};
  for (let i = 0; i < S.envs.length; i++) {
    const e = S.envs[i];
    try { index(await decJSON(b64d(e.k), D.envs[e.id]), i + 1); } catch (err) {}
  }
}
async function addEnv(id, nkBytes){
  if (S.envs.some(e => e.id === id)) return null;
  const env = await decJSON(nkBytes, D.envs[id]);
  S.envs.push({id, k: b64e(nkBytes), read: {}});
  index(env, S.envs.length);
  return env;
}

const SND = {ctx: null, out: null, rev: null, active: true, timer: null};
function sndInit(){
  if (SND.ctx) return true;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  const c = SND.ctx = new AC(), out = SND.out = c.createGain(); out.gain.value = 0;
  const comp = c.createDynamicsCompressor(); out.connect(comp); comp.connect(c.destination);
  /* yankı: üretilmiş dürtü yanıtı */
  const len = c.sampleRate * 4.5, ir = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  const rev = SND.rev = c.createConvolver(); rev.buffer = ir; const rg = c.createGain(); rg.gain.value = 0.7; rev.connect(rg); rg.connect(out);
  /* alçak uğultu: La ve Mi üzerinde, ağır açılıp kapanan süzgeçle */
  const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 300; lp.Q.value = 0.8;
  const dg = c.createGain(); dg.gain.value = 0.1; lp.connect(dg); dg.connect(out); dg.connect(rev);
  [[55, -6, "sawtooth", .32], [55, 6, "sawtooth", .32], [82.41, -3, "triangle", .3], [110, 4, "triangle", .18], [130.81, 0, "sine", .08]].forEach(([f, det, type, g]) => {
    const o = c.createOscillator(), og = c.createGain(); o.type = type; o.frequency.value = f; o.detune.value = det; og.gain.value = g; o.connect(og); og.connect(lp); o.start();
  });
  const l1 = c.createOscillator(), l1g = c.createGain(); l1.frequency.value = 0.043; l1g.gain.value = 150; l1.connect(l1g); l1g.connect(lp.frequency); l1.start();
  const l2 = c.createOscillator(), l2g = c.createGain(); l2.frequency.value = 0.019; l2g.gain.value = 0.035; l2.connect(l2g); l2g.connect(dg.gain); l2.start();
  /* camdaki yağmur: süzülmüş gürültü */
  const nb = c.createBuffer(1, c.sampleRate * 4, c.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const ns = c.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 0.35;
  const ng = c.createGain(); ng.gain.value = 0.014; ns.connect(bp); bp.connect(ng); ng.connect(out); ns.start();
  scheduleNote(2500);
  return true;
}
const NOTES = [220, 246.94, 261.63, 293.66, 329.63, 349.23, 440, 493.88, 523.25];
function playNote(f, t, v){
  const c = SND.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain(), dry = c.createGain();
  o.type = "sine"; o.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f * 2.001; g2.gain.value = 0.18;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0004, t + 4.5);
  dry.gain.value = 0.35; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(SND.rev); g.connect(dry); dry.connect(SND.out);
  o.start(t); o2.start(t); o.stop(t + 4.6); o2.stop(t + 4.6);
}
function scheduleNote(ms){
  clearTimeout(SND.timer);
  SND.timer = setTimeout(() => {
    const c = SND.ctx;
    if (c && c.state === "running" && SND.out.gain.value > 0.01) {
      const t = c.currentTime + 0.05, f = NOTES[Math.floor(Math.random() * NOTES.length)];
      playNote(f, t, 0.045);
      if (Math.random() < 0.45) playNote(NOTES[Math.floor(Math.random() * NOTES.length)] / (Math.random() < 0.5 ? 1 : 2), t + 0.9 + Math.random() * 1.4, 0.03);
    }
    scheduleNote(4200 + Math.random() * 6500);
  }, ms);
}
function sndApply(){
  if (!SND.ctx) return;
  const target = SET.snd && SND.active ? SET.vol * 0.9 : 0;
  if (target > 0 && SND.ctx.state === "suspended") SND.ctx.resume();
  SND.out.gain.cancelScheduledValues(SND.ctx.currentTime);
  SND.out.gain.setTargetAtTime(target, SND.ctx.currentTime, target > SND.out.gain.value ? 1.2 : 0.6);
}
function sndScene(active){ SND.active = active; sndApply(); }
function sndUnlock(){ if (SET.snd && sndInit()) { SND.ctx.resume(); sndApply(); } }

  if (!canRead(d)) return toast("Bu belgeyi " + roleName(d.r) + " okuyabilir.");
  OPEN = id;
  const st = envState(d.env); if (st && !st.read[id]) { st.read[id] = 1; save(); }
  $("#vb-title").textContent = d.title;
  $("#vb").innerHTML = '<article class="paper p-' + esc(d.paper) + '"><header class="ph"><span class="pk">' + esc(d.kind) + '</span><h2 id="viewer-title">' + esc(d.title) + "</h2>" + (d.sub ? '<p class="ps">' + esc(d.sub) + "</p>" : "") + "</header>" +
    '<div class="pb">' + d.html + "</div></article>";
  markDoc();
  $("#viewer").hidden = false; document.body.classList.add("noscroll");
  $("#vb").scrollTop = 0;
  if (focus) { const el = $('#vb [data-s="' + focus + '"]'); if (el) { el.scrollIntoView({block: "center"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); } }
  else $("#back").focus();
}
function markDoc(){
  $$("#vb .s").forEach(el => { const on = inNb(el.dataset.s); el.classList.toggle("on", on); el.setAttribute("aria-pressed", on ? "true" : "false"); el.setAttribute("role", "button"); });
  const n = nbOf(OPEN), c = $("#vb-count");
  c.hidden = !n; c.textContent = "Defterde " + n;
}
function closeV(){ $("#viewer").hidden = true; document.body.classList.remove("noscroll"); OPEN = null; if (screen === "room") renderRoom(); }
function toggleNb(id){
  const i = S.nb.findIndex(x => x.s === id);
  if (i >= 0) { S.nb.splice(i, 1); toast("Defterden çıkarıldı"); FORM.just = FORM.just.filter(x => x !== id); }
  else { S.nb.push({s: id, note: ""}); toast("Deftere eklendi"); }
  save(); markDoc();
}

function nbGroups(){
  const by = {};
  S.nb.forEach(x => { if (!SENT[x.s]) return; const d = SENT[x.s].doc; (by[d] = by[d] || []).push(x); });
  const docs = Object.keys(by).sort((a, b) => (ENV[DOC[a].env].n - ENV[DOC[b].env].n) || 0);
  return docs.map(d => ({d, items: by[d]}));
}

/* --- kilitler (v5) --- */
const normCode = t => String(t).toLocaleLowerCase("tr").replace(/[çğıöşüâî]/g, c => ({"ç": "c", "ğ": "g", "ı": "i", "ö": "o", "ş": "s", "ü": "u", "â": "a", "î": "i"}[c])).replace(/[^a-z0-9]/g, "");
async function pbkdf(code, salt, it){
  const base = await crypto.subtle.importKey("raw", te.encode(code), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt: b64d(salt), iterations: it, hash: "SHA-256"}, base, 256));
}
const LKIND = {phone: "Telefon", pdf: "Şifreli dosya", recorder: "Ses kayıt cihazı", lock: "Asma kilit"};
const HLV = ["İpucu", "Daha açık", "Cevabı söyle"];
let LH = {}, QH = {}, LMSG = {};
async function loadHints(){
  for (const l of D.locks) { const lv = S.hints["L" + l.id] || 0; if (lv && !LH[l.id]) try { LH[l.id] = await decJSON(await sha("LH|" + l.id), l.h); } catch (e) {} }
  for (let i = 0; i < D.qhints.length; i++) { const lv = S.hints["Q" + i] || 0; if (lv && !QH[i]) try { QH[i] = await decJSON(await sha("QH|" + i + "|" + D.id), D.qhints[i].h); } catch (e) {} }
  for (const c of D.chapters) { const lv = S.hints["C" + c.id] || 0; if (lv && !LH["C" + c.id]) try { LH["C" + c.id] = await decJSON(await sha("CH|" + c.id), c.h); } catch (e) {} }
}
function hintList(levels, lv){ return lv ? "<ol class=\"hl\">" + levels.slice(0, lv).map(t => "<li>" + esc(t) + "</li>").join("") + "</ol>" : ""; }
function hintBtn(key, lv){ return lv < 3 ? '<button type="button" class="btn quiet sm" data-hint="' + key + '">' + HLV[lv] + " · −" + R.pen.hint[lv] + "</button>" : ""; }
function locksBox(){
  const vis = D.locks.filter(l => !l.after || hasEnv(l.after));
  if (!vis.length) return "";
  return '<section class="stack"><h2 class="sec-h">' + ic("kilit") + " Kilitli malzemeler</h2>" + '<div class="locks">' + vis.map(l => {
    const open = hasEnv(l.e), lv = S.hints["L" + l.id] || 0;
    if (open) return '<article class="lock open"><span class="lk">' + esc(LKIND[l.kind]) + "</span><h3>" + esc(l.name) + '</h3><p class="small ok-t">Açıldı · içindekiler aşağıda</p></article>';
    return '<article class="lock"><span class="lk">' + esc(LKIND[l.kind]) + "</span><h3>" + esc(l.name) + '</h3><p class="small muted">' + esc(l.sub) + "</p>" +
      '<form class="lockf" data-lock="' + l.id + '" autocomplete="off"><input type="text" name="code" aria-label="' + esc(l.name) + ' şifresi" placeholder="Şifre" maxlength="40" spellcheck="false"><button type="submit" class="btn">Aç</button></form>' +
      (LMSG[l.id] ? '<p class="small lmsg">' + esc(LMSG[l.id]) + "</p>" : "") +
      hintList(LH[l.id] || [], lv) + hintBtn("L" + l.id, lv) + "</article>";

}

let CHMSG = {}, CHSEL = {};
function chapterBox(){

async function answerChapter(id, v){
  const c = D.chapters.find(x => x.id === id); if (!c) return;
  if (!v) return toast("Bir cevap seçin.");
  const key = await pbkdf(normCode(v), c.salt, c.it);
  let nk = null;
  try { nk = await decRaw(key, c.w); } catch (e) {}
  if (!nk) { S.wrong = (S.wrong || 0) + 1; save(); CHMSG[id] = "Komiser başını sallıyor: Belgeler bunu söylemiyor. Bir daha bakın."; return renderRoom(); }
  await addEnv(c.next, nk); delete CHMSG[id];
  S.sc = {e: c.next, i: 0}; save(); go("scene");
}
function qhintBox(){
  return '<details class="card hint"' + (Object.keys(S.hints).some(k => k[0] === "Q") ? " open" : "") + '><summary><b>Takıldınız mı?</b> <span class="muted small">Hangi soruda takıldığınızı seçin; her kademe puandan düşer.</span></summary>' +
    D.qhints.map((q, i) => { const lv = S.hints["Q" + i] || 0; return '<div class="qh"><div class="qh-h"><b>' + esc(q.q) + '</b><span class="chip">' + lv + "/3</span></div>" + hintList(QH[i] || [], lv) + hintBtn("Q" + i, lv) + "</div>"; }).join("") + "</details>";
}
async function tryLock(id, code){
  const l = D.locks.find(x => x.id === id); if (!l || hasEnv(l.e)) return;
  const n = normCode(code); if (!n) return;
  const key = await pbkdf(n, l.salt, l.it);
  for (const w of l.w) {
    try {
      const nk = await decRaw(key, w);
      const env = await addEnv(l.e, nk); delete LMSG[id]; save();
      toast(l.name + " açıldı."); renderRoom();
      const first = env && env.docs[0]; if (first) openDoc(first.id);
      return;
    } catch (e) {}
  }
  LMSG[id] = "Açılmadı. Şifre bu değil."; renderRoom();
  const inp = document.querySelector('.lockf[data-lock="' + id + '"] input'); if (inp) inp.focus();
}
async function takeHintV5(key){
  const lv = S.hints[key] || 0; if (lv >= 3) return;
  S.hints[key] = lv + 1; S.pen += R.pen.hint[lv]; await loadHints(); save(); renderRoom();
}

function targetsFor(type){ const cat = TYPE[type][2]; return Object.values(TGT).filter(t => t.cat === cat).sort((a, b) => a.name.localeCompare(b.name, "tr")); }

async function submitReq(){
  const type = FORM.type, tid = FORM.target, just = FORM.just.slice();
  if (!tid) return toast("Bir hedef seçin.");
  if (!just.length) return toast("Defterden en az bir gerekçe cümlesi seçin.");
  const sorted = just.slice().sort();
  const sig = type + "|" + tid + "|" + sorted.join(",");
  if (S.reqs.some(r => !r.ok && !r.already && r.sig === sig)) { LAST = {msg: "Bunu az önce reddettim. Aynı kâğıdı ikinci kez önüme koymayın.", already: 1}; renderRoom(); return focusReply(); }
  const cands = [sorted]; if (sorted.length === 2) cands.push([sorted[0]], [sorted[1]]);
  const hits = [];
  for (const c of cands) {
    const h = (await shaHex("R|" + type + "|" + tid + "|" + c.join(","))).slice(0, 24);
    (D.req[h] || []).forEach(x => hits.push({c, x}));
  }
  const rec = {type, target: tid, just, txt: FORM.txt, sig};
  const freshHits = hits.filter(h => !hasEnv(h.x.e));
  if (freshHits.length) {
    const h = freshHits[0];
    const secs = h.c.map(id => SENT[id].s);
    const nk = await decRaw(await sha("RK|" + type + "|" + tid + "|" + secs.join("|")), h.x.w);
    const env = await addEnv(h.x.e, nk);
    Object.assign(rec, {ok: 1, n: env.n, env: env.id});
    LAST = {ok: 1, n: env.n, msg: env.note};
    if (MP) mpPost("env", {type, target: tid, just, env: env.id, k: b64e(nk), title: env.title});
    HINT = await findHint();
    FORM = {type, target: "", just: [], txt: "", filter: ""};
  } else if (hits.length) {
    Object.assign(rec, {already: 1});
    LAST = {already: 1, msg: R.already};
    if (MP) mpPost("reqfail", {type, target: tid, just, already: 1, sig});
  } else {
    let half = false;
    for (const id of sorted) if (D.part[(await shaHex("P|" + type + "|" + tid + "|" + id)).slice(0, 24)]) half = true;
    const t = TGT[tid], pool = R.reject[type];
    const msg = half ? R.half : (t && t.none) || pool[S.reqs.filter(r => !r.ok).length % pool.length];
    rec.pen = R.pen.reject; S.pen += R.pen.reject;
    if (MP) mpPost("reqfail", {type, target: tid, just, pen: R.pen.reject, sig});
    LAST = {msg, pen: R.pen.reject};
  }
  S.reqs.push(rec); save(); renderRoom(); focusReply();
}

let HINT = null;
async function findHint(){
  await loadHints();
  if (!D.hints) return null;
  const c = D.hints.filter(h => !hasEnv(h.e) && TGT[h.g] && h.t.every(id => SENT[id])).sort((a, b) => a.p - b.p);
  if (!c.length) return null;
  const pick = c.filter(h => h.p === c[0].p).sort((a, b) => (b.t.filter(inNb).length - a.t.filter(inNb).length))[0];
  try { const p = await decJSON(await sha("HK|" + pick.t.map(id => SENT[id].s).join("|")), pick.w); return {e: pick.e, l: p.l}; } catch (e) { return null; }
}
function hintBox(){

}

async function grade(form){
  const fd = form instanceof FormData ? form : new FormData(form), F = D.fin, fh = async (...p) => (await shaHex(F.salt + "|" + p.join("|"))).slice(0, 20);
  let total = 0; const parts = [];
  for (const s of F.sections) {
    let pts = 0, ok = false, info = "";
    if (s.type === "one") { const v = fd.get(s.id); ok = !!v && s.ok.includes(await fh(s.id, v)); pts = ok ? s.w : 0; }
    if (s.type === "multi") {
      const sel = new Set(fd.getAll(s.id)); let good = 0;
      for (const o of s.opts) { const inOk = s.ok.includes(await fh(s.id, o.v)); if (inOk === sel.has(o.v)) good++; }
      pts = Math.round(s.w * good / s.opts.length); ok = good === s.opts.length; info = good + "/" + s.opts.length + " doğru";
    }
    if (s.type === "evidence") {
      const sel = fd.getAll(s.id).slice(0, s.max), gs = new Set(); let off = 0;
      for (const id of sel) { const g = s.groups[await fh(s.id, id)]; if (g) gs.add(g); else off++; }
      pts = Math.max(0, Math.round(s.w * Math.min(1, gs.size / s.full)) - off * 2); ok = gs.size >= s.full;
      info = gs.size + " bağımsız kaynak" + (off ? " · " + off + " ilgisiz cümle" : "");
    }
    total += pts; parts.push({id: s.id, q: s.q, pts, w: s.w, ok, info});
  }
  let epi = null;
  try { const k = await sha("EP|" + F.salt + "|" + F.core.map(c => fd.get(c) || "").join("|")); epi = (await decJSON(k, F.epi)).html; } catch (e) {}
  return {total, pen: S.pen, final: Math.max(0, total - S.pen), parts, epi};
}

const keepOpen = (k, def) => (k in KEEP ? KEEP[k] : def) ? " open" : "";
function mpUnread(){ if (!inGame()) return 0; const f = MP.room.feed, i = f.findIndex(x => x.id === S.fid); return f.slice(i + 1).filter(x => x.t === "msg" && x.by !== MP.pid).length; }

/* ---------------- ağ ---------------- */
async function api(a, data, cred){
  let r;
  try { r = await fetch(API, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(Object.assign({a}, cred || (MP ? {code: MP.code, pid: MP.pid, token: MP.token} : {}), data || {}))}); }
  catch (e) { throw new Error("Sunucuya ulaşılamadı. Online mod, oyunun bir web sunucusundan açılmasını ve internet bağlantısını gerektirir."); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!j) throw new Error("Sunucu beklenmeyen bir cevap verdi (" + r.status + "). Online mod için PHP destekli bir sunucu gerekir.");
  if (!j.ok) { const er = new Error(j.err || "İşlem yapılamadı."); er.status = r.status; throw er; }
  return j;
}
async function mpPost(a, data){
  if (!MP) return null;
  try { const j = await api(a, data); if (j.room) await applyRoom(j.room); return j; }
  catch (e) { toast(e.message); return null; }
}
function mpBegin(code, pid, token){
  mpStop();
  MP = {code, pid, token, room: null, v: -1, timer: null, loaded: false, dirty: false, fails: 0, q: Promise.resolve()};
  lsSet(MPSAVE + ":" + USER.slug, JSON.stringify({code, pid, token}));
}
function mpStop(){ if (!MP) return; clearTimeout(MP.timer); MP = null; }
function mpLoop(){ if (!MP) return; clearTimeout(MP.timer); MP.timer = setTimeout(mpPoll, document.hidden ? 4000 : 1500); }
async function mpPoll(){
  const cur = MP; if (!cur) return;
  try {
    const j = await api("state", {v: cur.v}); if (MP !== cur) return;
    if (cur.fails >= 3) toast("Bağlantı geri geldi.");
    cur.fails = 0;
    if (j.room) await applyRoom(j.room); else mpPresence(j.on);
  } catch (e) {
    if (MP !== cur) return;
    if (e.status === 403 || e.status === 404) { mpForget(); mpStop(); await loadSP(); MPERR = "Oda kapanmış ya da bu odadaki kaydınız silinmiş."; return go("online"); }
    if (++cur.fails === 3) toast("Bağlantı koptu; yeniden deneniyor…");
  }
  mpLoop();
}
function mpPresence(on){
  if (!MP || !MP.room || !on) return;
  let ch = false; MP.room.players.forEach(p => { const v = on.includes(p.id); if (p.on !== v) { p.on = v; ch = true; } });
  if (ch && (screen === "lobby" || (screen === "room" && tab === "ekip"))) softRender();
}
/* sunucudan gelen oda durumunu sırayla uygula */
function applyRoom(room){ if (!MP) return Promise.resolve(); const cur = MP; cur.q = cur.q.then(() => (MP === cur ? applyRoomNow(room) : null)).catch(() => {}); return cur.q; }
async function applyRoomNow(room){
  if (room.v < MP.v) return;
  const prev = MP.room;
  room.hints = Array.isArray(room.hints) ? {} : room.hints || {}; room.votes = Array.isArray(room.votes) ? {} : room.votes || {};
  MP.room = room; MP.v = room.v;
  if (room.status === "lobby") { if (screen === "lobby") softRender(); else go("lobby"); return; }
  if (!MP.loaded) { /* oyuna giriş: kişisel defteri yükle, ortak zarfları aç */
    MP.loaded = true;
    S = null; try { const raw = lsGet(mpKey()); if (raw) S = JSON.parse(raw); } catch (e) {}
    if (!S || S.v !== 4) S = fresh();
    S.stage = "room"; MP.read = Object.fromEntries((S.envs || []).map(e => [e.id, e.read])); S.envs = [];
    if (S.fid === undefined) S.fid = room.feed.length ? room.feed[room.feed.length - 1].id : "";
    ENV = {}; DOC = {}; SENT = {}; TGT = {}; LAST = null; HINT = null; PSEL.clear(); PTXT = ""; VOTE = null;
    FORM = {type: "sorgu", target: "", just: [], txt: "", filter: ""}; tab = "zarflar";
  }
  for (const e of room.envs) {
    if (hasEnv(e.id)) continue;
    try {
      const env = await addEnv(e.id, b64d(e.k)); if (!env) continue;
      if (MP.read[e.id]) envState(e.id).read = MP.read[e.id];
      if (prev && prev.status !== "lobby" && e.by && e.by !== MP.pid) toast(playerName(e.by) + " yeni bir zarf aldı: " + env.title);
    } catch (err) {}
  }
  S.pen = room.pen; S.hints = room.hints; S.reqs = room.reqs; S.board = room.board;
  if (room.final && !S.report) S.report = await grade(answersFD(room.final.answers));
  if (!room.final) S.report = null;
  if (room.status !== "vote") VOTE = null;
  save(); HINT = await findHint(); await warmOpts();
  if (prev && prev.status !== "lobby") room.feed.filter(f => f.by !== MP.pid && !prev.feed.some(x => x.id === f.id)).forEach(f => {
    if (f.t === "msg" && !(screen === "room" && tab === "ekip")) toast(playerName(f.by) + ": " + f.text);
    else if (f.t === "pano" || (f.t === "sys" && /oylama|karar/i.test(f.text))) toast(f.text);
  });
  if (screen !== "room") return go("room");
  softRender();
}
/* yazı yazan ya da belge okuyan oyuncuyu bölmeden yeniden çiz */
function softRender(){
  if (!MP || (screen !== "room" && screen !== "lobby")) return;
  const a = document.activeElement, typing = a && a.closest && a.closest("#app") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && a.type !== "radio";
  if (typing || !$("#viewer").hidden || !$("#modal").hidden) { MP.dirty = true; return; }
  MP.dirty = false; const y = window.scrollY;
  if (screen === "lobby") renderLobby(); else renderRoom();
  window.scrollTo(0, y);
}
document.addEventListener("focusout", () => setTimeout(() => { if (MP && MP.dirty) softRender(); }, 200));
document.addEventListener("toggle", e => { const t = e.target; if (t.dataset && t.dataset.keep) KEEP[t.dataset.keep] = t.open; }, true);
document.addEventListener("visibilitychange", () => { if (MP && !document.hidden) mpLoop(); });

async function mpJoin(code){

  if (!/^[A-Z0-9]{5}$/.test(code)) { MPERR = "Oda kodu 5 karakterdir."; return renderOnline(); }
  try { const j = await api("join", {code, name: USER.name}, {}); mpBegin(j.code, j.pid, j.token); await applyRoom(j.room); mpLoop(); }
  catch (e) { MPERR = e.message; renderOnline(); }

  catch (e) { mpStop(); if (e.status === 403 || e.status === 404) mpForget(); MPERR = e.message; renderOnline(); }

/* ---------------- olaylar (engine.js'teki dinleyiciler buraya danışır) ---------------- */
async function mpClick(b, d){
  if (b.id === "onback") { MPERR = ""; go("menu"); return true; }
  if (b.id === "mcreate") { b.disabled = true; await mpCreate(); return true; }
  if (b.id === "mresume") { b.disabled = true; await mpResume(); return true; }
  if (b.id === "mforget") { mpForget(); renderOnline(); return true; }
  if (!MP) return false;
  if (b.id === "mcopy") { try { await navigator.clipboard.writeText(MP.code); toast("Oda kodu kopyalandı: " + MP.code); } catch (e) { toast("Oda kodu: " + MP.code); } return true; }
  if (d.role) { await mpPost("role", {role: d.role}); return true; }
  if (b.id === "mstart") { b.disabled = true; await mpPost("start", {env: D.start.e, k: D.start.k}); return true; }
  if (b.id === "mleave") { if (!d.armed) { d.armed = "1"; b.textContent = "Emin misin? Odadan ayrıl"; return true; } await mpLeave(); return true; }
  if (b.id === "gothelp" && inGame()) { S.help = 1; save(); renderRoom(); return true; }
  if (d.tlmove) { await mpPost("tl_move", {id: d.tlmove, dir: +d.dir}); return true; }
  if (d.tldel) { await mpPost("tl_del", {id: d.tldel}); return true; }
  if (b.id === "vopen") { if (!d.armed) { d.armed = "1"; b.textContent = "Onayla · oylamayı başlat"; return true; } await mpPost("vote_open"); return true; }
  if (b.id === "vcancel") { await mpPost("vote_cancel"); return true; }
  if (b.id === "vfinal") { if (!d.armed) { d.armed = "1"; b.textContent = "Onayla · rapor teslim edilir"; return true; } collectVote(); const ev = D.fin.sections.find(x => x.type === "evidence"); await mpPost("final", {evidence: (VOTE && ev && VOTE[ev.id]) || [], ekey: ev ? ev.id : "r7"}); window.scrollTo(0, 0); return true; }
  if (d.tab === "rapor" && inGame()) { tab = "karar"; renderRoom(); return true; }
  return false;
}
async function mpSubmit(f){
  if (f.id === "joinf") { await mpJoin($("#mcode").value); return true; }
  if (!MP) return false;
  if (f.id === "msgf") { const t = $("#msgt").value.trim(); if (t) { $("#msgt").value = ""; await mpPost("msg", {text: t}); const fe = $("#feed"); if (fe) fe.scrollTop = fe.scrollHeight; } return true; }
  if (f.id === "tlf") { const t = $("#tlt").value.trim(); if (!t) { toast("Ne olduğunu yaz."); return true; } const w = $("#tlw").value.trim(); $("#tlt").value = ""; $("#tlw").value = ""; await mpPost("tl_add", {when: w, text: t}); return true; }
  if (f.id === "votef") {
    collectVote();
    const miss = D.fin.sections.filter(s => s.type === "one" && !VOTE[s.id]).map(s => D.fin.sections.indexOf(s) + 1), er = $("#vote-err");
    if (miss.length) { er.hidden = false; er.textContent = "Şu soruları yanıtla: " + miss.join(", ") + "."; er.scrollIntoView({block: "center"}); return true; }
    const j = await mpPost("vote", {answers: VOTE}); if (j) toast("Oyun kaydedildi."); return true;
  }
  return false;
}
function mpChange(t){
  if (t.id === "mcode") return true;
  if (MP && t.closest && t.closest("#votef")) {
    if (t.dataset.max && t.checked && $$('#votef input[name="' + t.name + '"]:checked').length > +t.dataset.max) { t.checked = false; toast("En fazla " + t.dataset.max + " cümle seçebilirsin."); }
    collectVote(); return true;
  }
  return false;
}
function mpInput(t){ if (t.id === "mcode") t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); }

</script>
